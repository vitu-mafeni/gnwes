name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: build, vet, unit tests (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - run: go test ./... -race -v

  integration:
    name: concurrency load test against a live kind cluster
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: gnwes-ci
      - name: install CRDs
        run: kubectl apply -f config/crd/bases/
      - name: start manager
        run: |
          go run ./cmd/manager --health-probe-bind-address=:8081 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz && break
            sleep 1
          done
      - name: run concurrency load test
        run: go run ./cmd/loadtest -actors=40 -concurrency=10 -pool-size=3
