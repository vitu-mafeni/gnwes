---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: vfiogpupools.gnwes.io
spec:
  group: gnwes.io
  names:
    kind: VFIOGPUPool
    listKind: VFIOGPUPoolList
    plural: vfiogpupools
    shortNames:
    - vgp
    singular: vfiogpupool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.totalDevices
      name: Total
      type: integer
    - jsonPath: .status.availableDevices
      name: Available
      type: integer
    - jsonPath: .status.attachedDevices
      name: Attached
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VFIOGPUPool is a fixed inventory of real, physical VFIO-bound GPUs on one
          node, available for live hot-attach/detach into a cloud-hypervisor guest
          via VMGPUAttachment. This is the "real hardware" counterpart to
          GPUWorkerPool -- same shape, same race-free pool-bookkeeping property
          (see internal/vfiopool), but naming actual devices instead of simulated
          slots, and feeding VMGPUAttachment's live hotplug instead of GPULease's
          sleep-and-annotate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VFIOGPUPoolSpec declares a fixed inventory of real, physical VFIO-bound
              GPUs on one node. Unlike GPUWorkerPoolSpec (which conjures simulated slots
              on demand via PoolSize), real devices either exist on the node or don't --
              this just lists the ones VMGPUAttachments on this pool may acquire.
            properties:
              devices:
                description: Devices is the fixed set of real VFIO devices this pool
                  manages.
                items:
                  description: VFIODeviceSpec names one real, physical VFIO-bound
                    GPU.
                  properties:
                    id:
                      description: |-
                        ID is a stable logical name for this device within the pool (e.g.
                        "gpu-0"), used by VMGPUAttachmentStatus.DeviceID and by
                        VMGPUAttachmentSpec.DeviceRef to pin a specific device.
                      type: string
                    pciPath:
                      description: |-
                        PCIPath is the device's host sysfs path, e.g.
                        "/sys/bus/pci/devices/0000:01:00.0/" -- what gets passed as
                        chclient.DeviceConfig.Path on hot-attach.
                      type: string
                  required:
                  - id
                  - pciPath
                  type: object
                minItems: 1
                type: array
              nodeName:
                description: |-
                  NodeName is the node these devices physically live on. A
                  VFIOGPUPoolReconciler/bridge is expected to run with access to that
                  node (or be told its device inventory out of band) -- this type only
                  declares the inventory, it does not discover it.
                type: string
            required:
            - devices
            - nodeName
            type: object
          status:
            description: |-
              VFIOGPUPoolStatus mirrors the live vfiopool.Pool state for visibility,
              the same relationship GPUWorkerPoolStatus has to internal/pool.
            properties:
              attachedDevices:
                format: int32
                type: integer
              availableDevices:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              totalDevices:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
