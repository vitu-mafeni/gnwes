# CRI-O drop-in for the Exclusive (VFIO) tier's GPU worker node(s), e.g.
# dcn-gpu-0. Install at /etc/crio/crio.conf.d/99999-vfio-annotations.conf
# (the "99999" prefix matters: CRI-O loads /etc/crio/crio.conf.d/*.conf in
# plain byte-sorted filename order, and this must sort after every other
# drop-in that might also touch [crio.runtime] -- confirmed against this
# project's own node, where it needed to load after 999-runc.conf) and
# restart crio (`sudo systemctl restart crio`) to apply. Confirmed live
# 2026-11-14 -- see config/vmgpu/README.md for the full account of each
# fix below.
#
# IMPORTANT: CRI-O loads EVERY file in crio.conf.d/, not just *.conf --
# confirmed the hard way when a stray *.conf.bak backup silently
# overrode a same-session edit. Never leave a backup of this file (or
# any crio.conf.d file) inside crio.conf.d/ itself; back it up elsewhere.
[crio.runtime]
  # Required for podgate-webhook's io.kubernetes.cri-o.Devices pod
  # annotation (cmd/podgate-webhook/main.go's vfioDevicesAnnotationValue)
  # to actually grant the worker container's device cgroup access to
  # /dev/vfio/vfio and the specific IOMMU group device node(s) below --
  # without this, privileged:true is the only alternative, and that's a
  # hard incompatibility for this workload (ateworker-microvm refuses to
  # start under it; see config/vmgpu/README.md).
  allowed_annotations = ["io.kubernetes.cri-o.Devices"]

  # The specific host devices podgate-webhook's annotation is allowed to
  # request. Update the IOMMU group number to match your own GPU --
  # discover it via:
  #   for d in /sys/bus/pci/devices/<your-GPU-BDF>.*; do
  #     echo "$d -> $(basename $(readlink -f $d/iommu_group))"
  #   done
  # This cluster's single TITAN RTX is group 8.
  allowed_devices = ["/dev/vfio/vfio", "/dev/vfio/8"]

  # VFIO device passthrough pins the guest's entire RAM into physical
  # memory for DMA (needed on every vm.add-device AND every vm.restore,
  # i.e. every kubectl-ate resume). The Linux default memlock limit (8
  # MiB) is nowhere near enough and fails with
  # "vfio_pin_pages_remote: RLIMIT_MEMLOCK (8388608) exceeded" in dmesg,
  # fatally so on vm.restore (which must pin the whole guest memory in
  # one shot, unlike an incremental hot-attach into an already-running,
  # already-partially-pinned VM). Applied at container-create time, so
  # an already-running worker pod must be recreated to pick this up.
  default_ulimits = ["memlock=-1:-1"]
