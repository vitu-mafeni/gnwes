---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gnwes.io
  resources:
  - gpuleases
  - gpuworkerpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gnwes.io
  resources:
  - gpuleases/status
  - gpuworkerpools/status
  verbs:
  - get
  - patch
  - update
