apiVersion: v1
kind: Namespace
metadata:
  name: gnwes-dra-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gnwes-mock-gpu-driver
  namespace: gnwes-dra-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gnwes-mock-gpu-driver
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gnwes-mock-gpu-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gnwes-mock-gpu-driver
subjects:
- kind: ServiceAccount
  name: gnwes-mock-gpu-driver
  namespace: gnwes-dra-demo
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gnwes-mock-gpu-driver
  namespace: gnwes-dra-demo
spec:
  selector:
    matchLabels:
      app: gnwes-mock-gpu-driver
  template:
    metadata:
      labels:
        app: gnwes-mock-gpu-driver
    spec:
      serviceAccountName: gnwes-mock-gpu-driver
      priorityClassName: system-node-critical
      containers:
      - name: driver
        image: localhost:5001/gnwes-mock-gpu-driver:latest
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true # simplest way to get write access to the host
            # kubelet plugin/registry and CDI directories below; a real
            # driver would scope this down to exactly the mounts it needs.
        volumeMounts:
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
        - name: cdi-etc
          mountPath: /etc/cdi
        - name: cdi-run
          mountPath: /var/run/cdi
      volumes:
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: Directory
      - name: cdi-etc
        hostPath:
          path: /etc/cdi
          type: DirectoryOrCreate
      - name: cdi-run
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
