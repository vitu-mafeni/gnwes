apiVersion: v1
kind: ServiceAccount
metadata:
  name: gnwes-podgate-webhook
  namespace: ate-demo-counter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnwes-podgate-webhook
  namespace: ate-demo-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnwes-podgate-webhook
  template:
    metadata:
      labels:
        app: gnwes-podgate-webhook
    spec:
      serviceAccountName: gnwes-podgate-webhook
      containers:
      - name: webhook
        image: localhost:5001/gnwes-podgate-webhook:latest
        env:
        # The image cmd/substrate-gpu-bridge/Dockerfile builds. Only read
        # when a pod carries gnwes.io/gpu-backend=Exclusive (Backend=Shared
        # pods never get a sidecar injected, so this is harmless to leave at
        # its default on a cluster with no Exclusive-tier pools at all).
        - name: BRIDGE_IMAGE
          value: localhost:5001/substrate-gpu-bridge:latest
        # Hardware/BIOS-topology-specific: the IOMMU group(s) the
        # cluster's vfio-pci-bound GPU(s) land in, discovered per node via
        #   for d in /sys/bus/pci/devices/<BDF>.*; do readlink -f $d/iommu_group; done
        # Confirmed 8 for dcn-gpu-0's GPU (all four 0000:18:00.* PCI
        # functions) on 2026-11-14. Comma-separate multiple groups.
        - name: VFIO_IOMMU_GROUPS
          value: "8"
        ports:
        - containerPort: 8443
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gnwes-podgate-webhook
  namespace: ate-demo-counter
spec:
  selector:
    app: gnwes-podgate-webhook
  ports:
  - port: 443
    targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gnwes-podgate-webhook
webhooks:
- name: podgate.gnwes.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  timeoutSeconds: 5
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    operations: ["CREATE"]
  objectSelector:
    matchExpressions:
    - key: gnwes.io/gpu-pool
      operator: Exists
  clientConfig:
    service:
      name: gnwes-podgate-webhook
      namespace: ate-demo-counter
      path: /mutate
      port: 443
    caBundle: 
