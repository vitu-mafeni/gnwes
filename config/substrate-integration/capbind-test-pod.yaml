# Minimal isolated test: does CAP_NET_BIND_SERVICE actually let a non-root
# container bind a privileged port on this cluster's CRI-O/runc, independent
# of ate-api-server's own code? Mirrors ate-api-server's exact securityContext.
apiVersion: v1
kind: Pod
metadata:
  name: capbind-test
  namespace: ate-system
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: python:3.12-alpine
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_BIND_SERVICE"]
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 65532
    command:
    - /bin/sh
    - -c
    - |
      id
      python3 -c "
      import socket
      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      try:
          s.bind(('0.0.0.0', 443))
          print('BIND SUCCEEDED on :443')
      except PermissionError as e:
          print('BIND FAILED:', e)
      "
